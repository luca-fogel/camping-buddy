name: CampingBuddy
options:
  bundleIdPrefix: com.luca.campingbuddy
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "5"
packages:
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4
targets:
  CampingBuddy:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - path: Resources/ReferenceLibrary
        type: folder
        buildPhase: resources
      - path: Resources/ModelCatalog
        type: folder
        buildPhase: resources
      - path: Resources/Acknowledgments
        type: folder
        buildPhase: resources
    dependencies:
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLX
        product: MLX
      - package: Transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luca.campingbuddy.prototype
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/CampingBuddy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Camping Buddy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  CampingBuddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: CampingBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.luca.campingbuddy.uitests
  CampingModelCheck:
    type: tool
    platform: macOS
    sources:
      - CLI
      - Core
      - App/LocalModelEngine.swift
    dependencies:
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLX
        product: MLX
      - package: Transformers
        product: Tokenizers
schemes:
  CampingBuddy:
    build:
      targets:
        CampingBuddy: all
    test:
      targets: [CampingBuddyUITests]
  CampingModelCheck:
    build:
      targets:
        CampingModelCheck: all
