      <stop offset="0" stop-color="#1B4539"/>
      <stop offset="1" stop-color="#102D26"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="47%" r="58%">
      <stop offset="0" stop-color="#46765A" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#46765A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="banner"><rect width="1600" height="620" rx="28"/></clipPath>
    <clipPath id="landscape"><rect x="838" width="762" height="620"/></clipPath>
