<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="hero-title hero-description">
  <title id="hero-title">Camping Buddy — A little more ready. A little more outside.</title>
  <desc id="hero-description">An ivory camping tent beneath an amber sun, surrounded by contour lines on a deep pine background. On-device AI, saved guides, and a native iPhone app.</desc>
  <defs>
